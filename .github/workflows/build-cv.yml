name: Build CV

# Required secrets (set in repository settings):
#   SSH_PRIVATE_KEY  - Private key for deploying to website server
#   DEPLOY_HOST      - Server hostname/IP (e.g. 129.121.65.158)
#   DEPLOY_USER      - SSH username (e.g. wkngyomy)
#   DEPLOY_PATH      - Website root path with trailing slash
#                      (e.g. /home/wkngyomy/public_html/website_8a95d627/)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mycv/**"
      - "awesome-cv.cls"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "mycv/**"
      - "awesome-cv.cls"
      - ".github/workflows/**"

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6
        with:
          submodules: recursive

      - name: Install fonts
        run: |
          # TeX Live 2026 includes Source Sans 3, Roboto, and Font Awesome 7.
          # Symlink TeX Live fonts into fontconfig search path for XeTeX discovery.
          ln -sf /usr/local/texlive/2026/texmf-dist/fonts/opentype /usr/share/fonts/texlive-opentype
          fc-cache -f

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: python -m pip install pytest ./mycv/data ./mycv

      - name: Run tests
        working-directory: mycv
        run: make generate test

      - name: Build PDF
        working-directory: mycv
        run: make build

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: cv-pdf
          path: mycv/cv.pdf

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: cv-pdf

      - name: Setup SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy CV PDF
        run: |
          scp -i ~/.ssh/deploy_key \
            cv.pdf \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}files/cv.pdf
