name: Build CV

on:
  push:
    branches:
      - main
    paths:
      - "mycv/**"
  pull_request:
    paths:
      - "mycv/**"

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install fonts
        run: |
          apt update
          apt install --yes \
            fonts-roboto \
            fonts-adobe-sourcesans3 \
            ;

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install pydantic ruamel.yaml jinja2 pytest

      - name: Run tests
        working-directory: mycv
        run: make test

      - name: Build PDF
        working-directory: mycv
        run: make build

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cv-pdf
          path: mycv/cv.pdf
